[workspace]
resolver = "3"
members = [".", "vendor/qchess", "vendor/glicko2"]
default-members = ["."]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/npow/quantum-chess-bench"
[package]
name = "qbench-engine"
version.workspace = true
edition.workspace = true
build = "build.rs"
[dependencies]
qchess = { path = "vendor/qchess" }
glicko2 = { path = "vendor/glicko2" }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
[build-dependencies]
sha2 = "0.10"
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(kani)"] }
